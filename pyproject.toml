[project]
name = "ui-framework-dev"
version = "0.1.0"
description = "Task-Oriented UI Framework (PySide6 + CLI)"
requires-python = ">=3.10"
dependencies = ["PySide6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths   = ["framework/tests"]
addopts     = "-ra -q"
markers     = [
    "qt: tests that require a running QApplication (deselect with -m 'not qt')",
    "slow: tests with real sleep delays (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["framework", "app"]
omit   = ["*/__pycache__/*", "framework/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
